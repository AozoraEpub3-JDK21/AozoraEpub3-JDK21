plugins {
    id 'java'
    id 'application'
    // 依存関係の更新可否チェック用プラグイン
    id 'io.github.ben-manes.versions' version '0.67.0'
    // Windows .exe ランチャー生成（Smart App Control 対策）
    id 'edu.sc.seis.launch4j' version '4.0.0'
}

version = '1.8.1-jdk21'

// Gradle Wrapper を生成するためのタスク
wrapper {
    gradleVersion = '9.8.2'
    distributionType = Wrapper.DistributionType.BIN
}

// テスト JVM へ渡す -D（internal #47）。Gradle を動かす JVM の System.properties を丸ごと写すと java.home・java.version なども写り、
// 試験の JVM が別の版のとき（-PjavaToolchainVersion=25 など）Gradle 側の JDK を指して、java.text.Normalizer が
// その JDK の中の別の版のデータを探して初期化に失敗していた。渡すのは次の 2 つだけ:
//  1. コマンドラインで打った -D（例: -DhamelnE2E=true・-Djdk.internal.httpclient.debug=true）。Gradle 自身の org.gradle.*・gradle.* は除く
//  2. 試験が読む切り替え（HamelnE2ETest・AozoraEpub3ArchiveUrlTest・JavaAozoraVsReferenceTest）。gradle.properties の
//     systemProp.* や GRADLE_OPTS で付けても届くように、Gradle を動かす JVM から名前で拾う。試験に切り替えを足したらここにも足す
def testOptInProperties = ['hamelnE2E', 'archiveUrlE2E', 'referenceCompare']
tasks.withType(Test) {
    systemProperties System.properties.findAll { k, v -> k.toString() in testOptInProperties }
    systemProperties gradle.startParameter.systemPropertiesArgs.findAll { k, v -> !k.startsWith('org.gradle.') && !k.startsWith('gradle.') }

    // 試験が作業ディレクトリから直接読むフォルダを入力に入れる。入れないと、サイトの規則（web/*/extract.txt）・
    // テンプレート・外字を直しても、試験の段が「変わっていない」として飛ばされ、走らずに緑に見える
    ['web', 'template', 'gaiji'].each { dir ->
        inputs.dir(dir).withPropertyName("testDir_" + dir).withPathSensitivity(PathSensitivity.RELATIVE)
    }
    // 変換器がプロジェクトの root から読む注記の表・設定（chuki_*.txt・*.ini など）も同じ
    inputs.files(fileTree('.') { include 'chuki_*.txt', '*.ini', 'replace_*.txt' })
        .withPropertyName("testRootFiles").withPathSensitivity(PathSensitivity.RELATIVE)

    // JUnit 4.13.2 が JDK 26 のリフレクション挙動変化により
    // 非テストクラスにも InvalidTestClassError を発生させるため、
    // テスト検出対象から「テストでないクラス」を明示的に除外する。
    // 0C-1 (JUnit 5 移行) で根本解決予定だが、それまでこの exclude で
    // JDK 21 / 26 双方で全テストが走る状態を維持する。
    exclude '**/AozoraFullFlowTest.class'   // main() 実行スクリプト (runFullFlowTest task で実行)
    exclude '**/AozoraRealTest.class'       // main() 実行スクリプト (runRealTest task で実行)
    exclude '**/VelocityTestUtils.class'    // テストヘルパー (final class)
    exclude '**/EpubFixture.class'          // テストヘルパー (プレビュー用 EPUB 生成)
    exclude '**/*$*.class'                  // inner / anonymous class (data holder / stub)
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    // 警告を抑止するオプション
    options.compilerArgs = [
        '-Xlint:unchecked',
        '-Xlint:deprecation',
        '-Xdoclint:none'
    ]
}

repositories {
    mavenCentral()
}

// Disable reproducible builds to preserve actual file timestamps
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = true
    reproducibleFileOrder = false
}

dependencies {
    // Commons ライブラリを最新版に（セキュリティ対応）
        implementation 'commons-cli:commons-cli:1.11.0'
        implementation 'org.apache.commons:commons-collections4:4.6.0'
        implementation 'org.apache.commons:commons-compress:1.28.0'
        implementation 'org.apache.commons:commons-lang3:3.21.0'  // CVE修正: StackOverflowError脆弱性対応
    
    // JSoup を最新版に
        implementation 'org.jsoup:jsoup:1.23.2'
    
    // Junrar を最新版に
        implementation 'com.github.junrar:junrar:7.6.1'  // CVE修正: パストラバーサル脆弱性対応
    
    // Velocity を最新版に
        implementation 'org.apache.velocity:velocity-engine-core:2.4.1'
    
    // JAI（Java Advanced Imaging）- 代替ライブラリを使用
        implementation 'org.apache.xmlgraphics:batik-transcoder:1.20'
    
    // ログの実装（SLF4J）
        implementation 'org.slf4j:slf4j-api:2.0.17'
        implementation 'org.slf4j:slf4j-simple:2.0.17'

    // Swing の Look and Feel（GUI モダン化）
        implementation 'com.formdev:flatlaf:3.7.2'

    // Markdown の入力（構文の木だけ使い、青空文庫形式へは自前で書き出す。internal #72）
        implementation 'org.commonmark:commonmark:0.31.0'
        implementation 'org.commonmark:commonmark-ext-gfm-tables:0.31.0'
        implementation 'org.commonmark:commonmark-ext-yaml-front-matter:0.31.0'
    
    // テストフレームワーク
    testImplementation 'junit:junit:4.13.2'
    
    // XML/HTMLバリデーション用
    testImplementation 'xerces:xercesImpl:2.12.2'
}

// テスト実行時にも chuki_*.txt をクラスパスリソースとして参照可能にする
tasks.named('processResources') {
    from('.') {
        include 'chuki_*.txt'
    }
}

sourceSets {
    main {
        java {
            // 古いEclipse形式に合わせて、ソースフォルダを 'src' に指定
            srcDir 'src'
        }
        resources {
            srcDir 'src'
        }
    }
    test {
        java {
            srcDir 'test'
        }
        resources {
            srcDir 'test_data'
        }
    }
}

application {
    // メインクラス（プログラムの開始地点）を指定します
    // GUI が主体的に使用されるため AozoraEpub3Applet をメインに設定
    mainClass = 'AozoraEpub3Applet'
}

// Thin-JAR版の配布タスク（distZip/distTar）を無効化
// FAT-JAR版のみを配布するため
distZip.enabled = false
distTar.enabled = false

// Toolchain version is overridable via -PjavaToolchainVersion=<NN> (default 21).
// CI matrix passes the JDK version under test so compileJava actually uses that JDK
// (Gradle launcher JVM alone is not enough — without this, the compiler still uses 21).
// 例: ./gradlew jar -PjavaToolchainVersion=26 で JEP 504 (JDK 26 で javax.swing.JApplet 削除) 検証
def javaToolchainVersion = (project.findProperty('javaToolchainVersion') ?: '21').toString().toInteger()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaToolchainVersion)
    }
}

// jar ファイルを生成するタスク
jar {
    archiveBaseName = 'AozoraEpub3'
    archiveVersion = ''
    preserveFileTimestamps = true
    reproducibleFileOrder = false
    manifest {
        attributes(
            'Implementation-Title': 'AozoraEpub3',
            'Implementation-Version': project.version,
            'Main-Class': 'AozoraEpub3Applet'
        )
    }
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    // JAR ルートにリソースファイルを含める
    from('.') {
        include 'chuki_*.txt'
    }
    
    // template/ ディレクトリを JAR に含める
    from('template') {
        into 'template'
    }
    
    // gaiji/ ディレクトリを JAR に含める（オプション）
    from('gaiji') {
        into 'gaiji'
    }
    
    // 依存ライブラリを含める
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// THIRD-PARTY-NOTICES.txt must match the libraries packed into the jar above:
// - its list names exactly the bundled modules and versions,
// - every licence file it names exists under lib/ (shipped as LICENSE/),
// - the NOTICE file of every bundled jar is reproduced in its second part
//   (the fat jar keeps only one META-INF/NOTICE of each name).
// v1.8.0 shipped without LICENSE/flatlaf.txt and with six stale versions in the list.
tasks.register('checkThirdPartyNotices') {
    def notices = file('THIRD-PARTY-NOTICES.txt')
    def libDir = file('lib')
    def resolved = configurations.runtimeClasspath.incoming.artifacts.resolvedArtifacts.map { arts ->
        arts.collect { a ->
            def id = a.id.componentIdentifier
            id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                ? [group: id.group, module: id.module, version: id.version, file: a.file]
                : [group: null, module: id.displayName, version: null, file: a.file]
        }
    }
    doLast {
        def noticeHeader = 'NOTICE FILES OF THE APACHE LICENSE 2.0 COMPONENTS'
        def text = notices.getText('UTF-8').replace('\r', '')
        def split = text.indexOf(noticeHeader)
        if (split < 0) throw new GradleException("THIRD-PARTY-NOTICES.txt has no '${noticeHeader}' part")
        def listPart = text.substring(0, split)
        def normalise = { String line -> line.trim().replaceAll(/\s+/, ' ') }
        def noticeBody = { String t -> t.readLines().collect(normalise).findAll { it && !it.startsWith('==') }.join('\n') }
        def noticePart = noticeBody(text.substring(split))
        def problems = []

        def arts = resolved.get()
        arts.findAll { !it.version }.each { problems << "not a module dependency, so it cannot be listed by name and version: ${it.module}" }
        def modules = arts.findAll { it.version }
        modules.groupBy { it.module }.each { name, same ->
            def groups = same*.group.unique()
            if (groups.size() > 1) problems << "one name in several groups, list them apart: ${name} (${groups.join(', ')})"
        }

        def bundled = modules.collect { "${it.module} ${it.version}".toString() }.toSet()
        def listed = [] as Set
        listPart.readLines().findAll { it ==~ /^\s*-\s.*/ }.each { line ->
            def m = line =~ /^   - (\S+) (\S+)$/
            if (m.matches()) listed << "${m[0][1]} ${m[0][2]}".toString()
            else problems << "entry not in the form '   - name version': '${line}'"
        }
        (bundled - listed).sort().each { problems << "bundled but not listed: ${it}" }
        (listed - bundled).sort().each { problems << "listed but not bundled: ${it}" }

        (text =~ /LICENSE\/[\w.\/-]*\w/).collect { it }.toSet().sort().each {
            if (!new File(libDir, it).isFile()) problems << "licence file missing: lib/${it}"
        }

        modules.findAll { it.file.name.endsWith('.jar') }.sort { it.module }.each { mod ->
            new java.util.zip.ZipFile(mod.file).withCloseable { zip ->
                zip.entries().findAll { !it.directory && it.name ==~ /(?i)(.*\/)?NOTICE(\.txt)?/ }.each { entry ->
                    // the whole NOTICE, line by line in order, so a shared line elsewhere cannot stand in
                    def body = noticeBody(zip.getInputStream(entry).getText('UTF-8'))
                    if (body && !('\n' + noticePart + '\n').contains('\n' + body + '\n')) {
                        problems << "NOTICE of ${mod.module} ${mod.version} not reproduced (${entry.name}): '${body.readLines()[0]}'"
                    }
                }
            }
        }

        if (problems) {
            throw new GradleException("THIRD-PARTY-NOTICES.txt is out of date:\n  " + problems.join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn 'checkThirdPartyNotices' }

// Windows .exe ランチャー生成（Smart App Control 対策）
// narou.rb は java -cp AozoraEpub3.jar AozoraEpub3 を直接呼ぶため影響なし
launch4j {
    outfile       = 'AozoraEpub3.exe'
    mainClassName = 'AozoraEpub3Applet'
    headerType    = 'gui'                         // コンソールウィンドウなし
    icon          = "${projectDir}/AozoraEpub3.ico"
    jreMinVersion = '21'
    chdir         = '.'                            // .exe のあるフォルダを作業ディレクトリにする
    dontWrapJar   = true                           // JAR は別ファイルのまま（AozoraEpub3.jar と同じフォルダ）
    // v4.0.0: jar プロパティは廃止。Fat JAR のみ指定（依存JARは fat JAR 内に含まれるため不要）
    jarFiles      = files(tasks.jar.archiveFile)
    libraryDir    = '.'                            // .exe と同じフォルダの AozoraEpub3.jar を参照
}
createExe.dependsOn jar

// Unix ランチャーシェルスクリプトを生成
task createLauncher {
    doLast {
        // ディレクトリが存在しない場合は作成
        def distDir = file('build/distributions')
        distDir.mkdirs()

        // Windows 向けは Launch4j で .exe を生成するため .bat は廃止

        def launcherSh = file('build/distributions/AozoraEpub3.sh')
        launcherSh.text = '''#!/bin/bash
# AozoraEpub3 GUI Launcher for Unix/Linux/macOS

# Get the directory where this script is located
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

# Check if java is available
if ! command -v java &> /dev/null; then
    echo "Error: java not found in PATH."
    echo "Please install Java 21 or later."
    exit 1
fi

# Launch AozoraEpub3.jar
java -jar "$SCRIPT_DIR/AozoraEpub3.jar"
'''
        launcherSh.executable = true
    }
}

// 配布物に含める共通コンテンツ（zipDistribution / tarDistribution / installDist で共有）
// ここを 1 箇所更新すれば 3 経路すべての配布物に反映される（chuki_*.txt 追加忘れ等の事故防止）。
// 下の一覧は verifyDistSources が確かめるパスも兼ねる（一覧を 2 つ持たない）
ext.distRootFiles = ['README.md', 'LICENSE.txt', 'gpl.txt', 'README_Changes.txt', 'replace_sample.txt',
    'THIRD-PARTY-NOTICES.txt', 'chuki_*.txt', 'AozoraEpub3.ico', 'AozoraEpub3.ini', 'setting_narourb.ini']
// 作業ツリーのフォルダ → 配布物の中のフォルダ
ext.distDirs = ['gaiji': 'gaiji', 'presets': 'presets', 'web': 'web', 'template': 'template', 'lib/LICENSE': 'LICENSE']
ext.distCommonContent = { CopySpec spec ->
    spec.from('.') {
        include distRootFiles
    }
    distDirs.each { src, dst -> spec.from(src) { into dst } }
}

// 配布物は作業ツリーから写すので、コミットに無いファイルが混ざりうる
// （v1.8.0 の最初のビルドに、gitignore した web/www.aozora.gr.jp/replace.txt の下書きが入った。internal #66）。
// 配布物に写すパスと jar の元（src・build.gradle）で、追跡しているファイルの中身の変更（M）のほかの違い
// （?? 未追跡・!! gitignore・A 追加・D 削除・R/C 名前の変更と写し・T 種類の変更・U 衝突）があれば止める。
// 中身の変更（M）は止めずに一覧を警告する: リリースの手順はバージョンの書き換えをコミットする前に dist を作る
// （docs/release-procedure.md §2.3・§3.3・§4.1）。GUI が終了時に書き換える AozoraEpub3.ini もここに出る。
// Gradle が既定で写さないファイル（DirectoryScanner の既定の除外: .DS_Store・*~・._* など）は数えない。
// 承知で作るときは -PallowDirtyDist（値なしか true。false・0 などは許さない）。git の無い木（ソースの tarball など）では警告だけ。
// 改行だけの違い（CRLF↔LF）は git が揃えて比べるので見えない（§6.12）
ext.distCheckedPaths = distRootFiles + distDirs.keySet().toList() + ['src', 'build.gradle']
ext.verifyDistSourcesNow = { Task task ->
    def root = projectDir
    def flag = project.findProperty('allowDirtyDist')
    def allowDirty = flag != null && (flag.toString().isEmpty() || flag.toString().equalsIgnoreCase('true'))
    if (flag != null && !allowDirty && !flag.toString().equalsIgnoreCase('false')) {
        task.logger.warn("verifyDistSources: -PallowDirtyDist=" + flag + " は値なしか true のときだけ効きます。この値では許しません")
    }
    // 許すときは、通したことが分かるように出所の手掛かりも添える (何も通さない走行では言わない)
    def fail = { String msg ->
        if (!allowDirty) throw new GradleException(msg)
        task.logger.warn(msg + "\n（-PallowDirtyDist が効いているので止めずに続けます。gradle.properties や ORG_GRADLE_PROJECT_allowDirtyDist から来ることもあります）")
    }
    if (!new File(root, '.git').exists()) {
        task.logger.warn("verifyDistSources: git の木ではないので、配布物に入るファイルを確かめていません")
        return
    }
    // パスは :(glob) で渡す: git の素の * は / をまたぐ（chuki_*.txt が chuki_old/x.txt にも当たる）が、Gradle の include はまたがない
    def cmd = ['git', 'status', '--porcelain', '-z', '--ignored', '--untracked-files=all', '--'] + distCheckedPaths.collect { ':(glob)' + it }
    def out, err, code
    try {
        def pb = new ProcessBuilder(cmd).directory(root)
        // フックやスクリプトが向けた別の index・木を見ない（Gradle が写すのはこの作業ツリー）
        ['GIT_DIR', 'GIT_WORK_TREE', 'GIT_INDEX_FILE', 'GIT_COMMON_DIR'].each { pb.environment().remove(it) }
        def proc = pb.start()
        def errBuf = new StringBuilder()
        def errThread = Thread.start { errBuf.append(proc.errorStream.getText('UTF-8')) }
        out = proc.inputStream.getText('UTF-8')
        code = proc.waitFor()
        errThread.join()
        err = errBuf.toString()
    } catch (IOException e) {
        fail("verifyDistSources: git を動かせず、配布物に入るファイルを確かめられませんでした（PATH に git が要ります）: " + e.message)
        return
    }
    if (code != 0) {
        fail("verifyDistSources: git status に失敗し、配布物に入るファイルを確かめられませんでした:\n" + err)
        return
    }
    // -z の 1 項目は「XY パス」。名前の変更・写し（X か Y が R/C）は次の項目に元のパスが続く。
    // 除外の判定はどちらのパスでも見る（除外に当たる名前へ変えても、元のファイルが無くなったことは残す）
    def entries = []
    def origins = [:]
    def parts = out.split('\u0000', -1).toList()
    for (int n = 0; n < parts.size(); n++) {
        def e = parts[n]
        if (e.length() < 4) continue
        entries << e
        if ('RC'.indexOf(e.substring(0, 1)) >= 0 || 'RC'.indexOf(e.substring(1, 2)) >= 0) {
            if (n + 1 < parts.size()) origins[e] = parts[n + 1]
            n++
        }
    }
    // Gradle の既定の除外（Ant の **/名前 と **/名前/**）を名前の型にして、パスのどの段に当たっても除く
    // （除外に当たるフォルダは Gradle が中へ入らない）。git のパスは OS によらず / 区切り。
    // 照合は Ant の文字列の照合（大文字小文字を区別し、OS のパスの規則に依らない）
    def namePatterns = org.apache.tools.ant.DirectoryScanner.getDefaultExcludes().collect {
        it.replaceFirst('^\\*\\*/', '').replaceFirst('/\\*\\*$', '')
    }
    def defaultExcluded = { String path ->
        path.split('/').any { seg -> namePatterns.any { org.apache.tools.ant.types.selectors.SelectorUtils.match(it, seg, true) } }
    }
    entries = entries.findAll { !defaultExcluded(it.substring(3)) || (origins[it] != null && !defaultExcluded(origins[it])) }
    // 警告で済ますのは、追跡しているファイルの中身の変更（X・Y が空白か M）だけ。
    // 未追跡・gitignore・add した新しいファイル・消したファイル・名前の変更・解決していない衝突はリポジトリの内容と違うので止める
    def foreign = entries.findAll { !(' M'.indexOf(it.substring(0, 1)) >= 0 && ' M'.indexOf(it.substring(1, 2)) >= 0) }
    def modified = entries - foreign
    if (!modified.isEmpty()) {
        task.logger.warn("verifyDistSources: コミットしていない変更が配布物に入ります（バージョンの書き換えなど意図したものか確かめてください）:\n  " +
            modified.join('\n  '))
    }
    if (!foreign.isEmpty()) {
        fail("配布物に入るパスに、コミットと違うファイルがあります:\n  " + foreign.join('\n  ') + "\n" +
            "直し方: ?? !! は消すか別の場所へ移す。A は git restore --staged して消す（入れるならコミットする）。" +
            "D・R・C・T は git restore で戻すかコミットする。U は衝突を解いてコミットする。" +
            "迷ったらきれいな worktree で作り直す（docs/release-procedure.md §6.12）。承知のうえなら -PallowDirtyDist")
    }
}
// 配布物を写すタスクの前に毎回走る（結果を持たないので最新扱いで飛ばされない）。ビルドの後に走らせ、写す直前に近づける
tasks.register('verifyDistSources') {
    description = '配布物に入るパスと jar の元に、コミットと違うファイルが無いかを確かめる'
    outputs.upToDateWhen { false }
    mustRunAfter 'build', 'jar', 'createExe', 'createLauncher'
    doLast { verifyDistSourcesNow(it) }
}

// 配布用の ZIP アーカイブを生成（FAT-JAR版 - ダブルクリック起動可能）
task zipDistribution(type: Zip, dependsOn: [build, createExe, 'verifyDistSources']) {
    archiveFileName = "AozoraEpub3-${project.version ?: 'dist'}.zip"
    destinationDirectory = file('build/distributions')
    preserveFileTimestamps = true
    reproducibleFileOrder = false

    // jar タスクが作った 1 本だけ（build/libs に残った古い jar を拾わない）
    from(tasks.named('jar'))
    from("${buildDir}/launch4j") {
        // ZIP (Windows-oriented) - .exe launcher（.bat から .exe に変更）
        include 'AozoraEpub3.exe'
    }
    distCommonContent(it)
}

// 配布用の TAR アーカイブを生成（FAT-JAR版 - ダブルクリック起動可能）
task tarDistribution(type: Tar, dependsOn: [build, createLauncher, 'verifyDistSources']) {
    archiveFileName = "AozoraEpub3-${project.version ?: 'dist'}.tar.gz"
    destinationDirectory = file('build/distributions')
    compression = Compression.GZIP
    preserveFileTimestamps = true
    reproducibleFileOrder = false

    // jar タスクが作った 1 本だけ（build/libs に残った古い jar を拾わない）
    from(tasks.named('jar'))
    from('build/distributions') {
        // TAR (Unix-oriented) - include only the Unix shell launcher
        include 'AozoraEpub3.sh'
        filePermissions {
