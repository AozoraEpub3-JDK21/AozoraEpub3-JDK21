#AozoraEpub3 Parameters
#
# JavaAozoraVsReferenceTest 専用の設定（-i で明示的に渡す）。
#
# 参照 EPUB（aozoraepub3-dotnet/tests/integration/reference/*/reference.epub）は
# v1.4.x 時点の「同梱 AozoraEpub3.ini（24 キー）+ 旧 CLI のハードコード既定値」で変換した出力。
# ini にキーが無いときの CLI 既定値は項目 24 で GUI 側の値に揃えたため（SettingDefaults）、
# 24 キーのままでは実効値が変わってしまう。出力に影響する 8 キー
# （TocVertical / PageBreak / FitImage / ImageSizeType / SinglePageSizeW / SinglePageSizeH /
#   JpegQuality / MaxCoverLine）は旧 CLI の実効値を末尾で明示している。
# byte 一致の契約を維持するため、同梱 ini や GUI 初期値が変わっても本ファイルは変更しない。
# 参照 EPUB を作り直したときだけ、そのとき使った設定に合わせて更新すること。
TocPage=1
CoverPage=1
TitlePage=2
TitlePageWrite=1
TitleToc=1
NcxNest=1
NavNest=1
ChapterExclude=1
ChapterSection=1
ChapterH=1
ChapterH1=1
ChapterH2=1
ChapterH3=1
ChapterName=1
MaxChapterNameLength=64
AutoYoko=1
AutoYokoNum1=1
AutoYokoNum3=1
PageBreakSize=400
PageBreakEmptySize=300
PageBreakChapterSize=200
SpaceHyphenation=1
DakutenType=2
# --- ここから旧 CLI の実効値（ini にキーが無いときのハードコード既定値）の明示 ---
TocVertical=
PageBreak=
FitImage=
ImageSizeType=2
SinglePageSizeW=480
SinglePageSizeH=640
JpegQuality=80
MaxCoverLine=0
