#AozoraEpub3 Parameters
#
# 配布時の既定設定。GUI で設定を変更して終了すると、このファイルは GUI が
# 書き出す内容（コメントなし・全キー）で上書きされる。
#
# 値の書き方は GUI の保存形式に合わせている:
#   ON  = 1
#   OFF = 空 (キー名と = だけを書く)
# キーを削除すると、CLI は com.github.hmdev.config.SettingDefaults の既定値
# （＝GUI のチェックボックス初期状態）で動く。
#
# 注意 1: BodyMargin / BodyMarginUnit と PageMargin はここに書かない。
# CLI 側が単位を変換せずに連結する既知の不具合があるため
# （docs/code-audit-followups.md 項目 25）。PageMarginUnit だけ残してあるのは
# GUI が読むため。PageMargin が無い間は CLI 側で使われない。
#
# 注意 2: GUI は起動時にここを読むため、値を変えると新規展開した配布物の GUI 起動状態も
# 変わる（AozoraEpub3Applet の setPropsSelected は props.containsKey で判定する）。
# 値は「v1.4.x までの配布物と同じ GUI 起動状態」になるようにしてある:
#   旧・同梱 ini（24 キー）にあったキーはその値のまま、
#   無かったキーは GUI のウィジェット初期値（test_data/gui_default_settings.ini と同じ）。
# 旧 ini にキーが無かった分、CLI の実効値は従来の出力から変わる（自動改ページ ON など）。
# narou.rb 参照 EPUB との比較（test/JavaAozoraVsReferenceTest）は
# test_data/reference_comparison.ini を -i で明示して従来設定を固定している。

# --- 出力するページ ---
CoverPage=1
TitlePageWrite=1
# 表題ページの形式 (0:本文内 1:左右中央 2:横書き)
TitlePage=2
TocPage=1
# 目次ページの組み方向 (1:縦書き / 空:横書き)
TocVertical=1
TitleToc=1
CoverPageToc=
MaxCoverLine=10

# --- 目次に載せる見出し ---
NcxNest=1
NavNest=1
ChapterExclude=1
ChapterSection=1
ChapterH=1
ChapterH1=1
ChapterH2=1
ChapterH3=1
ChapterName=1
ChapterUseNextLine=
SameLineChapter=
ChapterNumOnly=
ChapterNumTitle=
ChapterNumParen=
ChapterNumParenTitle=
ChapterPattern=
ChapterPatternText=
MaxChapterNameLength=64

# --- 本文の変換 ---
AutoYoko=1
AutoYokoNum1=1
AutoYokoNum3=1
AutoYokoEQ1=
SpaceHyphenation=1
DakutenType=2
ChukiRuby=0
IvsBMP=
IvsSSP=
MarkId=
CommentPrint=
CommentConvert=
RemoveEmptyLine=0
MaxEmptyLine=0
ForceIndent=
BoldUseGothic=
GothicUseBold=
FontSize=100
LineHeight=1.8
PageMarginUnit=0

# --- 自動改ページ (サイズは KB) ---
PageBreak=1
PageBreakSize=400
PageBreakEmpty=
PageBreakEmptyLine=2
PageBreakEmptySize=300
PageBreakChapter=
PageBreakChapterSize=200

# --- 画面サイズと画像 ---
DispW=600
DispH=800
CoverW=600
CoverH=800
FitImage=1
ImageSizeType=3
ImageScale=1.0
SinglePageSizeW=400
SinglePageSizeH=600
SinglePageWidth=600
NoIllust=
SvgImage=
ResizeW=
ResizeNumW=2048
ResizeH=
ResizeNumH=2048
RotateImage=0
JpegQuality=85
Gamma=
GammaValue=1.0
ImageFloat=
ImageFloatType=0
ImageFloatW=600
ImageFloatH=400
ImageFloatPage=
ImageFloatBlock=

# --- 画像の余白自動除去 ---
AutoMargin=
AutoMarginLimitH=15
AutoMarginLimitV=15
AutoMarginWhiteLevel=80
AutoMarginPadding=1.0
AutoMarginNombre=0
AutoMarginNombreSize=3.0

# --- Web 小説の取得 (GUI 用。CLI は -url / -interval / -cache で指定する) ---
UseNarouApi=1
ApiFallback=1
AuthorCommentStyle=0
WebInterval=0.5
WebModifiedExpire=24
WebModifiedOnly=
WebModifiedTail=
WebConvertUpdated=
WebBeforeChapter=
WebBeforeChapterCount=1
WebSkipImages=

# --- GUI の既定値 (CLI はコマンドラインオプションで指定する) ---
TitleType=0
EncType=0
Ext=.epub
Vertical=1
AutoFileName=1
UseFileName=
OverWrite=1
SamePath=
PubFirst=
Cover=
ReplaceCover=
CoverHistory=1
ChkConfirm=1
CachePath=.cache
AutoPreview=
